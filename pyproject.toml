[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-to-edge-seg"
version = "0.1.0"
description = "Distill foundation-model segmentation knowledge into edge-ready models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
train = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.8,<1",
]
edge = [
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "onnxscript>=0.5,<1",
]

[project.scripts]
fm-edge-seg = "fm_to_edge_seg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
